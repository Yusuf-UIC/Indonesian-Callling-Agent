[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "indonesia-ivr-speech-ai"
version = "0.1.0"
description = "Bahasa Indonesia IVR Speech AI with Solace Event-Driven Architecture"
readme = "docs/Bahasa Indonesia IVR Speech AI - Step-by-Step Build Plan.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Indonesia IVR Team", email = "team@example.com"}
]
keywords = ["ivr", "speech", "indonesian", "solace", "banking", "voice-ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "python-dotenv>=1.0",
    "sentence-transformers>=6.1",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "groq>=1.7",
    "ollama>=0.6",
    "edge-tts>=7.2",
    "pydub>=0.25",
    "sounddevice>=0.5",
    "scipy>=1.11",
    "silero-vad>=6.2",
    "paho-mqtt>=2.1",
    "faster-whisper>=1.2",
    "torch>=2.2",
    "pygame>=2.6",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.6",
    "mypy>=1.10",
    "black>=24.0",
]
gpu = [
    "torch[cuda]",
    "sentence-transformers[gpu]",
]

[project.scripts]
ivr-agent = "app.services.agent_solace:main"
ivr-voice = "app.cli.interactive_voice_solace:main"
ivr-text = "app.cli.interactive_voice_solace:main"
ivr-consumer = "app.services.banking_consumer:main"
ivr-api = "app.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "T20"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["src/indonesia_ivr"]
omit = ["*/tests/*", "*/__pycache__/*"]