version: '3.8'

services:
  solace:
    image: solace/solace-pubsub-standard:latest
    container_name: solace-broker
    shm_size: '1g'
    ulimits:
      core: -1
      nofile:
        soft: 1048576
        hard: 1048576
    ports:
      - "55555:55555"   # SMF (Solace Message Format) - for applications
      - "8080:8080"     # SEMP v2 (Management API) - internal port 8080
      - "1883:1883"     # MQTT
      - "8008:8008"     # Web Messaging (WebSocket)
      - "8001:8000"     # Web Messaging SSL / REST
      - "5672:5672"     # AMQP
      - "9000:9000"     # REST
      - "2222:2222"     # SSH (management)
    environment:
      - username_admin_globalaccesslevel=admin
      - username_admin_password=admin
      - system_scaling_maxconnectioncount=100
    volumes:
      - solace_data:/usr/sw/jail
      - solace_config:/usr/sw/config
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "-u", "admin:admin", "http://localhost:8080/SEMP/v2/config/msgVpns/default"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  mock-banking-api:
    build: .
    container_name: mock-banking-api
    ports:
      - "8000:8000"
    environment:
      - SOLACE_HOST=solace
      - SOLACE_PORT=55555
      - SOLACE_USERNAME=admin
      - SOLACE_PASSWORD=admin
      - SOLACE_VPN=default
    depends_on:
      solace:
        condition: service_healthy
    volumes:
      - .:/app
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000

volumes:
  solace_data:
  solace_config: